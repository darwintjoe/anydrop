<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnyDrop</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="" class="brand-icon" />
      <span>AnyDrop</span>
    </div>
    <div id="live-badge" class="live hidden"><span class="dot"></span>Live</div>
  </header>

  <!-- SETUP VIEW -->
  <main id="setup" class="hidden">
    <p class="setup-hint">1 · Point AnyDrop at your server</p>
    <input id="server-url" type="url" placeholder="https://your-anydrop-server" spellcheck="false" />
    <p class="setup-sub">Open the AnyDrop website, click “Copy server URL” in the pairing panel, paste it here.</p>

    <p class="setup-hint">2 · Pair a Drop Room</p>
    <button id="create-room" class="btn-primary">Create room</button>
    <div class="divider"><span>or join an existing one</span></div>
    <div class="join-row">
      <input id="join-code" maxlength="6" placeholder="CODE" autocomplete="off" />
      <button id="join-room" class="btn-secondary">Join</button>
    </div>
    <p id="setup-error" class="error hidden"></p>
  </main>

  <!-- MAIN VIEW -->
  <main id="main" class="hidden">
    <div class="room-row">
      <button id="copy-code" class="code-chip" title="Copy room code">
        <span class="code-label">ROOM</span>
        <span id="room-code" class="code-value">······</span>
      </button>
      <button id="toggle-qr" class="btn-ghost" title="Show pairing QR">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M21 14v.01"/><path d="M14 21v.01"/><path d="M17.5 17.5v.01"/><path d="M21 21v.01"/></svg>
      </button>
      <button id="drop-page" class="btn-primary btn-small" title="Send this tab's URL to your phone">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        Drop page
      </button>
    </div>

    <div id="qr-panel" class="qr-panel hidden">
      <img id="qr-img" alt="Pairing QR code" />
      <p>Scan with your phone camera to open this room on mobile.</p>
    </div>

    <!-- CHAT-BOX COMPOSER -->
    <div class="composer">
      <div class="composer-row">
        <button id="attach-btn" class="btn-ghost" title="Attach files or photos">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input id="composer-input" placeholder="Message, link, anything…" autocomplete="off" spellcheck="false" />
        <button id="composer-send" class="send-btn" title="Drop it" disabled>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
      <input id="attach-input" type="file" multiple class="hidden" />
    </div>

    <div id="drop-list" class="drop-list" aria-label="Dropped items"></div>

    <footer class="footer">
      <a id="open-web" href="#" target="_blank">Open web app</a>
      <span class="spacer"></span>
      <button id="leave-room" class="btn-link danger">Leave room</button>
    </footer>
  </main>

  <!-- IMAGE VIEWER (lightbox) -->
  <div id="viewer" class="viewer hidden" role="dialog" aria-label="Image viewer">
    <div class="viewer-top">
      <span id="viewer-name" class="viewer-name"></span>
      <button id="viewer-close" class="icon-btn viewer-close" title="Close" aria-label="Close viewer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="viewer-stage"><img id="viewer-img" alt="Dropped image" /></div>
    <div class="viewer-actions">
      <button id="viewer-copy" class="btn-primary">Copy image</button>
      <button id="viewer-download" class="btn-secondary">Download</button>
      <button id="viewer-open" class="btn-secondary">Open</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
