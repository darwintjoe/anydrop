name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web app — lint + build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create SQLite schema
        run: bun run db:push

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  extension:
    name: Chrome extension — syntax + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check extension scripts
        run: |
          node --check extension/popup.js
          node --check extension/scan.js
          node --check extension/background.js
          python3 -c "import json; json.load(open('extension/manifest.json'))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Package extension zip
        run: python3 scripts/build_extension.py
        env:
          # Repo variable (Settings → Secrets and variables → Actions → Variables).
          # Set DEFAULT_SERVER_URL there to bake your public server into release zips.
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anydrop-extension
          path: public/anydrop-extension.zip

  socket-service:
    name: Socket service — compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: mini-services/drop-socket

      - name: Compile check
        run: bun build index.ts --target=node --outfile /tmp/drop-socket-check.js
        working-directory: mini-services/drop-socket

  release:
    name: Attach extension zip to tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anydrop-extension
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anydrop-extension.zip
          generate_release_notes: true
